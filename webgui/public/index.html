<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WireVault · VPN vigilance control</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #111823;
        --panel2: #17212e;
        --line: #223046;
        --txt: #d7e2f0;
        --dim: #7c8ba1;
        --green: #2ecc71;
        --amber: #f39c12;
        --red: #e74c3c;
        --blue: #3fa9f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--txt);
             font: 14px/1.4 system-ui, Segoe UI, sans-serif; }
      header { display: flex; align-items: center; gap: 14px; padding: 12px 20px;
               border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
      header .fade { color: var(--dim); font-size: 12px; }
      header .badge { margin-left: auto; color: var(--dim); font-size: 13px; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
             background: var(--dim); margin-right: 6px; vertical-align: middle; }
      .dot.on { background: var(--green); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 20px; }
      .panel { background: var(--panel); border: 1px solid var(--line);
               border-radius: 10px; padding: 14px; }
      .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
                  color: var(--dim); margin: 0 0 10px; }
      .row { display: flex; justify-content: space-between; margin: 5px 0; color: var(--dim); }
      .row b { color: var(--txt); font-weight: 500; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
               font-size: 13px; }
      th { color: var(--dim); font-weight: 600; }
      .ok { color: var(--green); } .warn { color: var(--amber); } .crit { color: var(--red); }
      .sev { font-weight: 700; }
      .sev.info { color: var(--blue); } .sev.warning { color: var(--amber); }
      .sev.critical { color: var(--red); }
      button { background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
               border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      button:hover { border-color: var(--blue); }
      .fade { color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <h1>WireVault</h1>
      <span class="fade">VPN vigilance · traffic filter · security watch</span>
      <div class="badge"><span id="conn" class="dot"></span><span id="conn-txt">connecting…</span></div>
    </header>
    <div class="grid">
      <div class="panel">
        <h2>WireGuard peers</h2>
        <table id="peers"><thead><tr><th>name</th><th>endpoint</th><th>RX</th><th>TX</th><th>state</th></tr></thead><tbody></tbody></table>
        <button id="apply">Apply config</button>
      </div>
      <div class="panel">
        <h2>Filter (nftables)</h2>
        <div id="filter"></div>
      </div>
      <div class="panel">
        <h2>Incidents / audit</h2>
        <div id="incidents"></div>
      </div>
      <div class="panel">
        <h2>System</h2>
        <div id="system" class="fade">—</div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
